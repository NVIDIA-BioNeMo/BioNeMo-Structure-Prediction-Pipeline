[workspace]
name = "bspp-preprocessing-runtime"
version = "1.0.0"
description = "Locked scientific and process runtime for BSPP preprocessing"
channels = ["conda-forge"]
platforms = ["linux-64"]
conda-pypi-map = false

[dependencies]
python = "3.12.*"
bash = ">=5.2,<6"
coreutils = ">=9,<10"
tar = ">=1.35,<2"
lz4-c = ">=1.9,<2"
util-linux = ">=2.39,<3"
rsync = { version = "==3.4.4", build = "h5440a77_0" }
pip = ">=24,<27"
click = ">=8.1,<9"
pydantic = ">=2,<3"
pyyaml = ">=6,<7"
tabulate = ">=0.9,<1"

[pypi-dependencies]
colabfold = "==1.6.2"

[workspace]
name = "bspp-orchestration-container-latest"
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
linux = "6.1"
cuda = "13.0"

[dependencies]
python = "3.12.*"
pip = "*"
cuda-version = "13.0.*"
# torch 2.11.0+cu130 wheel metadata requires setuptools<82.
setuptools = "<82"

[pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu130"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.11.0%2Bcu130.html" }]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
# Torch stack: chosen from the newest PyG torch-cluster wheel matrix first.
torch = "==2.11.0+cu130"
torch-cluster = "==1.6.3+pt211cu130"
nvidia-nvcomp-cu13 = "==5.2.0.13"

# bspp-orchestration runtime dependencies.
click = ">=8.1"
google-cloud-storage = "*"
pyarrow = ">=17.0.0"
duckdb = ">=1.1.3"
orjson = ">=3.9.0"
pyyaml = ">=6.0"
numpy = ">=2.0"
pydantic = ">=2,<3"
tabulate = ">=0.9"
rich = ">=13.0"
submitit = { git = "https://github.com/facebookincubator/submitit.git", tag = "1.5.4" }
zstandard = ">=0.23"

# AFDB Integration Kit production dependencies.
# Structure-parser stack pinned to the current-proven versions: fastpdb writes
# to biotite's PDBFile.lines, which biotite 1.7 turned into a read-only getset
# descriptor — under biotite 1.7.x every stage_13 parse silently degrades to an
# empty protein ("All proteins have 0 residues"; task853_latest_20260901 failed
# 4992/4992 models at stage_13). Reproduced with fastpdb 1.3.3: biotite 1.6.0
# parses 512 residues, 1.7.1 parses 0. Keep latest = CUDA 13/torch 2.11; the
# scientific parser stack stays identical to current.
gemmi = "==0.7.5"
gemmi-program = ">=0.7.3"
jsonschema = { version = ">=4.24.0", extras = ["format-nongpl"] }
pandas = ">=2.0"
biotite = "==1.6.0"
mdtraj = "==1.11.1.post1"
pydssp = ">=0.9.0"
fastpdb = ">=1.2"
requests = ">=2.32.4"
tqdm = ">=4.66.5"
typer = ">=0.16.0"

[tasks]
smoke-gpu = "bash /usr/local/bin/bspp-container-smoke-gpu"

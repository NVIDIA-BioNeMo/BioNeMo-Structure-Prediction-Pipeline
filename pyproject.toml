[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-tabulate>=0.9",
]

[tool.uv.workspace]
members = [
    "packages/orchestration-contract",
    "packages/orchestration-control",
    "packages/orchestration-runtime",
]

# --- Tool configuration ---

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "packages/orchestration-contract/src",
    "packages/orchestration-control/src",
    "packages/orchestration-runtime/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "track_*_test_*.py"]
pythonpath = [
    "packages/orchestration-contract/src",
    "packages/orchestration-control/src",
    "packages/orchestration-runtime/src",
]
markers = [
    "e2e_full: marks tests requiring full afdb-toolkit[production] deps (deselect with '-m \"not e2e_full\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/orchestration-contract/src",
    "packages/orchestration-control/src",
    "packages/orchestration-runtime/src",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true

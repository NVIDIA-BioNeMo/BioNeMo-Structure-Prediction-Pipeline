[project]
name = "bspp-orchestration-runtime"
version = "0.1.0"
description = "Cluster-side BSPP run orchestration runtime"
authors = [
    { name = "BSPP Orchestration contributors" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "bspp-orchestration-contract",
    "click>=8.1",
    "duckdb>=1.1.3",
    "google-cloud-storage",
    "numpy>=2.0",
    "orjson>=3.9.0",
    "pyarrow>=17.0.0",
    "pydantic>=2,<3",
    "pyyaml>=6.0",
    "rich>=13.0",
    "submitit>=1.5.4,<1.6",
    "zstandard>=0.23",
]

[project.scripts]
bspp-orchestration-runtime = "bspp.orchestration.runtime.cli:cli"


[tool.uv.sources]
bspp-orchestration-contract = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/bspp"]

[tool.hatch.build.targets.wheel]
packages = ["src/bspp"]

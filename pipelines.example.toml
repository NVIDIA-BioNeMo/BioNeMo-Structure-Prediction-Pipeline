# BSPP orchestration runtime configuration — EXAMPLE.
# Copy this file to pipelines.toml and fill in your own values.
# pipelines.toml is operator-specific and intentionally untracked.

[gcs]
credentials = "<path-to-your-service-account-json>"
bucket = "<your-gcs-bucket>"
prefix = "<your-gcs-prefix>"

[gcs.paths]
manifest = "<your-manifest-csv-name>"

# S3 (S3-compatible object storage) — credentials come from the environment.
# Endpoint via $S3_ENDPOINT_URL; key/secret via $AWS_ACCESS_KEY_ID / $AWS_SECRET_ACCESS_KEY.
[s3]
bucket = "<your-s3-bucket>"
prefix = "<your-s3-prefix>"
endpoint_url_env = "S3_ENDPOINT_URL"


<text x="360" y="574" class="label" text-anchor="middle"><tspan x="360" dy="0">MSA generation</tspan><tspan x="360" dy="25">MMseqs2 GPU</tspan></text>
<rect x="240" y="636" width="240" height="59" rx="4" class="runtime"/>

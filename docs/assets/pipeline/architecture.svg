<text x="765" y="475" class="small" text-anchor="start"><tspan x="765" dy="0">Slurm jobs</tspan></text>
<rect x="765" y="492" width="270" height="301" rx="4" class="container"/>
<text x="780" y="519" class="small" text-anchor="start"><tspan x="780" dy="0">Runtime container(s)</tspan></text>
<rect x="780" y="541" width="240" height="80" rx="4" class="science"/>
<text x="900" y="574" class="label" text-anchor="middle"><tspan x="900" dy="0">Structure prediction</tspan><tspan x="900" dy="25">+ confidence scoring</tspan></text>

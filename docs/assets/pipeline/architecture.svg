<text x="40" y="90" class="subtitle" text-anchor="start"><tspan x="40" dy="0">One Control Plane · three phase boundaries · object storage or local handoffs</tspan></text>
<rect x="520" y="120" width="760" height="178" rx="4" class="container"/>
<rect x="520" y="120" width="760" height="49" rx="4" fill="#111111"/>
<text x="900" y="153" text-anchor="middle" style="fill:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700">Control Plane · bsppctl</text>
<text x="900" y="200" class="label" text-anchor="middle"><tspan x="900" dy="0">Author Plans → materialize RunSpecs → submit / monitor → fetch evidence</tspan></text>
<text x="900" y="238" class="label" text-anchor="middle"><tspan x="900" dy="0">Workstation: SSH   |   Site host with Slurm tools: local-slurm</tspan></text>
<text x="900" y="274" class="small" text-anchor="middle"><tspan x="900" dy="0">Scientific work runs only in scheduled jobs in either control mode.</tspan></text>
<path d="M 900 298 V 345 H 360 V 390" class="control"/>
<path d="M 900 298 V 390" class="control"/>
<path d="M 900 345 H 1440 V 390" class="control"/>
<text x="933" y="369" class="small" text-anchor="start"><tspan x="933" dy="0">Control / evidence</tspan></text>
<rect x="195" y="390" width="330" height="440" rx="4" class="artifact"/>
<text x="215" y="426" class="heading" text-anchor="start"><tspan x="215" dy="0">Cluster A</tspan></text>
<text x="505" y="426" class="small" text-anchor="end"><tspan x="505" dy="0">Preprocessing</tspan></text>
<rect x="210" y="447" width="300" height="363" rx="4" class="job"/>
<text x="225" y="475" class="small" text-anchor="start"><tspan x="225" dy="0">Slurm jobs</tspan></text>
<rect x="225" y="492" width="270" height="301" rx="4" class="container"/>
<text x="240" y="519" class="small" text-anchor="start"><tspan x="240" dy="0">Runtime container(s)</tspan></text>

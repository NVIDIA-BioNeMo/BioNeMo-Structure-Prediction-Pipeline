<rect x="240" y="710" width="240" height="62" rx="4" class="artifact"/>
<text x="360" y="735" class="small" text-anchor="middle"><tspan x="360" dy="0">MSA handoff</tspan><tspan x="360" dy="22">bspp.msa-set/v1</tspan></text>
<rect x="735" y="390" width="330" height="440" rx="4" class="artifact"/>
<text x="755" y="426" class="heading" text-anchor="start"><tspan x="755" dy="0">Cluster B</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
<title id="title">Pipeline architecture: Control Plane, scheduled compute, and data movement</title>
<desc id="desc">The bsppctl Control Plane authors Plans, materializes RunSpecs, submits and monitors Slurm jobs, and fetches evidence. Control can use SSH from a workstation or local-slurm from a site host. Three phase clusters may be separate or co-located. Preprocessing turns FASTA into a verified MSA set. Folding produces models, metadata, and a canonical pair index. Explicit packaging creates downstream prediction bundles and master parquet. At each phase seam, choose object storage or local pass-through. Postprocessing produces processed model artifacts and per-dataset parquet for a final object-storage destination. All scientific compute runs in scheduled jobs within runtime containers; acceptance, publication, and reference validation are separate.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
  .title { font-size: 34px; font-weight: 700; }
  .subtitle { font-size: 20px; fill: #555555; }
  .heading { font-size: 23px; font-weight: 700; }
  .label { font-size: 19px; }
  .small { font-size: 16px; fill: #555555; }
  .tiny { font-size: 14px; fill: #555555; }
  .edge { fill: none; stroke: #666666; stroke-width: 1.8; marker-end: url(#arrow); }
  .control { fill: none; stroke: #777777; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow); }
  .job { fill: #FFFFFF; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 7 5; }
  .container { fill: #F5F5F5; stroke: #777777; stroke-width: 1.5; }
  .runtime { fill: #E9E9E9; stroke: #888888; stroke-width: 1.3; }
  .science { fill: #76B900; stroke: #578700; stroke-width: 1.3; }
  .artifact { fill: #FFFFFF; stroke: #888888; stroke-width: 1.3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666666" stroke-width="1.4"/></marker></defs>
<rect width="1800" height="1040" fill="#FFFFFF"/>

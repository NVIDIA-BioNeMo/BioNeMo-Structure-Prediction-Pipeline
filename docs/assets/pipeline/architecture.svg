<text x="900" y="661" class="small" text-anchor="middle"><tspan x="900" dy="0">Canonicalize</tspan><tspan x="900" dy="22">model / metadata pairs</tspan></text>
<rect x="780" y="710" width="240" height="62" rx="4" class="artifact"/>
<text x="900" y="735" class="small" text-anchor="middle"><tspan x="900" dy="0">PDB + metadata</tspan><tspan x="900" dy="22">canonical-pair index</tspan></text>
<rect x="1275" y="390" width="330" height="440" rx="4" class="artifact"/>
<text x="1295" y="426" class="heading" text-anchor="start"><tspan x="1295" dy="0">Cluster C</tspan></text>
<text x="1585" y="426" class="small" text-anchor="end"><tspan x="1585" dy="0">Postprocessing</tspan></text>
<rect x="1290" y="447" width="300" height="363" rx="4" class="job"/>
<text x="1305" y="475" class="small" text-anchor="start"><tspan x="1305" dy="0">Slurm jobs</tspan></text>
<rect x="1305" y="492" width="270" height="301" rx="4" class="container"/>
<text x="1320" y="519" class="small" text-anchor="start"><tspan x="1320" dy="0">Runtime container(s)</tspan></text>
<rect x="1320" y="541" width="240" height="80" rx="4" class="science"/>
<text x="1440" y="574" class="label" text-anchor="middle"><tspan x="1440" dy="0">Confidence processing</tspan><tspan x="1440" dy="25">iPSAE / pDockQ2</tspan></text>
<rect x="1320" y="636" width="240" height="59" rx="4" class="runtime"/>
<text x="1440" y="661" class="small" text-anchor="middle"><tspan x="1440" dy="0">Process structures</tspan><tspan x="1440" dy="22">+ validate evidence</tspan></text>
<rect x="1320" y="710" width="240" height="62" rx="4" class="artifact"/>
<text x="1440" y="735" class="small" text-anchor="middle"><tspan x="1440" dy="0">Processed models</tspan><tspan x="1440" dy="22">+ per-dataset parquet</tspan></text>
<rect x="30" y="699" width="135" height="82" rx="4" class="artifact"/>
<text x="97" y="731" class="label" text-anchor="middle"><tspan x="97" dy="0">Raw input</tspan><tspan x="97" dy="27">.fa FASTA</tspan></text>
<path d="M 165 740 H 195" class="edge"/>
<rect x="550" y="626" width="160" height="189" rx="4" class="artifact"/>
<text x="630" y="652" class="tiny" text-anchor="middle"><tspan x="630" dy="0">SEAM: CHOOSE ONE</tspan></text>
<text x="630" y="691" class="small" text-anchor="middle"><tspan x="630" dy="0">Object storage</tspan><tspan x="630" dy="29">or</tspan><tspan x="630" dy="29">local pass-through</tspan></text>
<text x="630" y="796" class="tiny" text-anchor="middle"><tspan x="630" dy="0">Verified MSA set</tspan></text>
<path d="M 525 740 H 550" class="edge"/>
<path d="M 710 740 H 735" class="edge"/>
<rect x="1090" y="504" width="160" height="311" rx="4" class="artifact"/>
<text x="1170" y="522" class="tiny" text-anchor="middle"><tspan x="1170" dy="0">DOWNSTREAM</tspan><tspan x="1170" dy="15">HANDOFF</tspan></text>
<rect x="1100" y="543" width="140" height="63" rx="4" class="runtime"/>
<text x="1170" y="569" class="small" text-anchor="middle"><tspan x="1170" dy="0">Explicit</tspan><tspan x="1170" dy="23">packaging</tspan></text>
<text x="1170" y="633" class="small" text-anchor="middle"><tspan x="1170" dy="0">.tar.lz4 bundles</tspan><tspan x="1170" dy="23">+ master parquet</tspan></text>
<text x="1170" y="688" class="tiny" text-anchor="middle"><tspan x="1170" dy="0">SEAM: CHOOSE ONE</tspan></text>
<text x="1170" y="724" class="small" text-anchor="middle"><tspan x="1170" dy="0">Object storage</tspan><tspan x="1170" dy="29">or</tspan><tspan x="1170" dy="29">local pass-through</tspan></text>
<path d="M 1065 740 H 1090" class="edge"/>
<path d="M 1250 740 H 1275" class="edge"/>
<path d="M 1440 830 V 880" class="edge"/>
<rect x="1290" y="880" width="300" height="65" rx="4" class="artifact"/>
<text x="1440" y="907" class="label" text-anchor="middle"><tspan x="1440" dy="0">Final destination</tspan><tspan x="1440" dy="25">Object storage</tspan></text>
<text x="40" y="885" class="heading" text-anchor="start"><tspan x="40" dy="0">Placement and handoff choices</tspan></text>
<text x="40" y="920" class="label" text-anchor="start"><tspan x="40" dy="0">Clusters may be different sites or co-located. Local pass-through requires an accessible, verified artifact placement.</tspan><tspan x="40" dy="29">Initial FASTA input and final object-storage destination have no pass-through alternative.</tspan></text>
<text x="40" y="996" class="small" text-anchor="start"><tspan x="40" dy="0">Green: scientific compute   ·   Gray: runtime handling   ·   White: artifacts   ·   Dashed job boundary   ·   Solid container boundary</tspan></text>
<text x="40" y="1024" class="small" text-anchor="start"><tspan x="40" dy="0">Phase acceptance, publication, and reference validation are distinct operations.</tspan></text>
</svg>
